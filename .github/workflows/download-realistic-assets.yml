name: Download X LEGENDS Realistic Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download realistic models
        working-directory: project/X_LEGENDS
        run: node scripts/download_realistic_assets.mjs

      - name: Commit downloaded models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/X_LEGENDS/public/assets/models/realistic
          git commit -m "Add realistic medieval 3D assets" || echo "No changes"
          git push
