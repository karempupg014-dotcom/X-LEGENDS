name: X ZOMBIE - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - x-zombie-prototype
    paths:
      - "X_ZOMBIE/**"
      - ".github/workflows/x-zombie-android.yml"

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.4.1 and Android export templates
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates
          cp templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          cp templates/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          godot --version

      - name: Import project
        run: godot --headless --editor --path X_ZOMBIE --import --quit

      - name: Export debug APK
        run: |
          mkdir -p X_ZOMBIE/build
          godot --headless --path X_ZOMBIE --export-debug "Android" X_ZOMBIE/build/XZombie-debug.apk

      - name: Verify APK
        run: |
          test -s X_ZOMBIE/build/XZombie-debug.apk
          file X_ZOMBIE/build/XZombie-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X-ZOMBIE-Android-debug
          path: X_ZOMBIE/build/XZombie-debug.apk
          if-no-files-found: error
          retention-days: 14
