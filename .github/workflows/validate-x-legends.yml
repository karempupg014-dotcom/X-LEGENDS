name: Validate X LEGENDS Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'project/X_LEGENDS/**'
      - '.github/workflows/validate-x-legends.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/X_LEGENDS
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Build game
        run: npm run build
